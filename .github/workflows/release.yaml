name: release

on:
  pull_request_target:
    branches:
      - main

env:
  SHOREBIRD_TOKEN: eyJyZWZyZXNoX3Rva2VuIjoiMS8vMDNlQmJ5c2RjOHlKUkNnWUlBUkFBR0FNU053Ri1MOUlyX2ZYMlJLOWlsWERHZW15NEdUMHN2VVRlclBlTHY2dEdRTnNMS0x4WEphemFQMHJXSHUtdm4xYi1pZUxZNFZ1a1hJSSIsImF1dGhfcHJvdmlkZXIiOiJnb29nbGUifQ==

jobs:
  release-android:
    runs-on: ubuntu-latest

    name: 🤖 Release Android

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕️ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: 🚀 Shorebird Release
        uses: shorebirdtech/shorebird-release@v0
        env:
          KEYSTORE_FILE: keystore/upload-keystore.jks
          KEYSTORE_PASSWORD: masterkeys
          KEYSTORE_ALIAS: upload
        with:
          platform: android
          args: "--verbose --artifact=apk"

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wayagram-${{ github.ref_name }}.apk
          path: build/app/outputs/apk/release/app-release.apk

      - name: 📦 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: wayagram-${{ github.ref_name }}.aab
          path: build/app/outputs/bundle/release/app-release.aab

  release-ios:
    runs-on: macos-latest

    name: 🍎 Release iOS

    steps:
