name: wayagram
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.5 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.1
  feather_icons: ^1.2.0
  dio: ^4.0.4
  get_storage: ^2.0.3
  image_picker: ^0.8.5
  flutter_iconly: ^1.0.2
  carousel_slider: ^4.0.0
  flutter_rating_bar: ^4.0.0
  badges: ^2.0.2
  cached_network_image: ^3.2.0
  flutter_svg: ^1.0.3
  flutter_native_splash: ^2.1.3+1
  pull_to_refresh: ^2.0.0
  loading_animation_widget: ^1.1.0+5
  shimmer: ^2.0.0
  flutter_custom_tabs: ^1.0.4
  http: ^0.13.4
  equatable: ^2.0.3
  date_time_format: ^2.0.1
  dropdown_search: ^5.0.3
  loading_indicator: ^3.0.2
  qr_flutter: ^4.0.0
  image: ^3.1.0
  flutter_feather_icons: ^2.0.0+1
  qr_code_scanner: ^1.0.0
  path_provider: ^2.0.5
  hive: ^2.0.4
  hive_flutter: ^1.1.0
  toggle_switch: ^2.0.1
  nigerian_states_and_lga: ^1.0.0
  country_picker: ^2.0.16
  dart_countries: ^3.0.2
  otp_text_field: ^1.1.3
  story_view: ^0.13.2
  hashtager: ^1.0.4
  flutter_polls: ^0.1.0
  timeago: ^3.3.0
  transparent_image: ^2.0.0
  flutter_image_slideshow: ^0.1.4
  image_cropper: ^3.0.0
  video_thumbnail: ^0.5.3
  intl: ^0.17.0
  flutter_contacts: ^1.1.5+1
  permission_handler: ^10.2.0
  share_plus: ^6.3.0
  bordered_text: ^2.0.0
  flutter_dialogs: ^3.0.0
  chewie: ^1.3.5
  video_player: ^2.4.7
  flutter_cache_manager: ^3.3.0
  flutter_screenutil: ^5.5.4
  group_radio_button: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.10.0
  change_app_package_name: ^1.1.0

#wayaicon.png
  flutter_lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/wayaicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts: 
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Black.ttf
        - asset: assets/fonts/Lato-BlackItalic.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 600
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-ThinItalic.ttf
          weight: 100
          style: italic