name: wayagram
description: The codebase for the entire WayaGram application
homepage: https://wayagram.ng
publish_to: "none" # NEVER PUBLISH TO pub.dev!
version: 1.91.10+154

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_riverpod: ^2.6.1
  get_storage: ^2.1.1
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  #sqlite3_flutter_libs: ^0.5.29+1
  dio: ^5.2.1+1
  http: ^1.2.1
  svg_flutter: ^0.0.1
  flutter_screenutil: ^5.9.3
  screenshot: ^3.0.0
  share_plus: ^10.1.3
  gap: ^3.0.1
  flutter_verification_code: ^1.1.7
  flutter_svg: ^2.0.16
  clipboard: ^0.1.3
  dotted_border: ^2.1.0
  webview_flutter: ^4.10.0
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  firebase_messaging: ^15.1.6
  firebase_core: ^3.12.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  blurry_modal_progress_hud: ^1.1.1
  mime: ^2.0.0
  image_cropper: ^9.0.0
  http_parser: ^4.1.2
  #google_maps_flutter: ^2.10.0
  uuid: ^4.5.1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.4
  slide_countdown: ^2.0.2
  file_picker: ^9.0.2
  video_player: ^2.9.2
  # flutter_webrtc: ^0.12.9
  permission_handler: ^11.3.1
  audio_waveforms: ^1.2.0
  socket_io_client: ^3.0.2
  #rtmp_broadcaster:
   # git: https://github.com/OlJohnny/flutter_rtmp_broadcaster.git
  readmore: ^3.0.0
  timeago: ^3.2.2
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1
  #sqfentity: ^2.5.0
  #sqfentity_gen: ^2.5.0
  google_maps_flutter: ^2.10.0
  currency_text_input_formatter: ^2.2.3
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  syncfusion_flutter_sliders: ^28.2.6
  infinite_scroll_pagination: ^4.1.0
  video_trimmer: ^3.0.1-LTS
  stack_trace: ^1.12.0

  #for deep link
  app_links: ^6.4.0
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  #for pinch to zoom
  photo_view: ^0.15.0
  #for saving file to gallery
  gallery_saver_plus: ^3.2.4
  




dev_dependencies:
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.2
  build_runner: ^2.4.14
  build_verify: ^3.1.0
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  intl: "^0.20.1"
  source_gen: "^2.0.0"

  # This is fine.
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  image_path: "assets/images/waya-gen-logo.png"
  android: "wayagram_ic"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true

flutter_gen:
  output: lib/assetsgen/
  line_length: 80

  integrations:
    flutter_svg: true
    lottie: true

  fonts:
    enabled: false

  assets:
    enabled: true
    outputs:
      class_name: WayaAssets

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/auth/
    - assets/icons/gen_set/
    - assets/icons/wallet/
    - assets/images/explore/
    - assets/images/shop/
    - assets/images/bid/
    - assets/images/polls/
    - assets/images/pages/
    - assets/images/wallet/
    - assets/icons/
    - assets/fonts/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
